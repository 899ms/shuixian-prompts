<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="水仙的AI提示词">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FB3C9"/>
      <stop offset="1" stop-color="#1F6A85"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="18%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#g)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- 花瓣：六片 -->
  <g transform="translate(256 246)" fill="#ffffff" fill-opacity=".95">
    <ellipse cx="0" cy="-104" rx="42" ry="76"/>
    <ellipse cx="0" cy="-104" rx="42" ry="76" transform="rotate(60)"/>
    <ellipse cx="0" cy="-104" rx="42" ry="76" transform="rotate(120)"/>
    <ellipse cx="0" cy="-104" rx="42" ry="76" transform="rotate(180)"/>
    <ellipse cx="0" cy="-104" rx="42" ry="76" transform="rotate(240)"/>
    <ellipse cx="0" cy="-104" rx="42" ry="76" transform="rotate(300)"/>
  </g>

  <!-- 花心 -->
  <circle cx="256" cy="246" r="46" fill="#E3F4F8"/>
  <circle cx="256" cy="246" r="22" fill="#2C8CAB"/>

  <!-- 底部茎叶 -->
  <path d="M256 300v112" stroke="#ffffff" stroke-opacity=".92" stroke-width="18" stroke-linecap="round"/>
  <path d="M256 356c-34 0-62-18-74-44 34-4 62 12 74 44z" fill="#ffffff" fill-opacity=".82"/>
  <path d="M256 400c30 0 56-16 68-40-32-4-58 10-68 40z" fill="#ffffff" fill-opacity=".68"/>
</svg>
